{# Single row produk pembelian — di-append ke #produk-rows via HTMX #}
<div class="grid grid-cols-1 md:grid-cols-12 gap-2 items-end produk-row p-3 rounded-lg bg-slate-50 border border-slate-200">
    <div class="md:col-span-6">
        <label class="block text-xs text-slate-500 mb-1">Produk</label>
        <select name="id_produk" required
                class="searchable-dropdown w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                data-placeholder="Cari produk...">
            <option value="">— Pilih produk —</option>
            {% for p in master_produks %}
            <option value="{{ p.id_produk }}" data-harga="{{ p.harga_jual }}">
                [{{ p.kode_produk }}] {{ p.nama_produk }} (Rp {{ "{:,.0f}".format(p.harga_jual|float).replace(",", ".") }})
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="md:col-span-2">
        <label class="block text-xs text-slate-500 mb-1">Qty</label>
        <input type="number" name="qty" min="0.1" step="0.1" value="1" required
               class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="md:col-span-3">
        <label class="block text-xs text-slate-500 mb-1">Aturan Pakai <span class="text-slate-400">(opsional)</span></label>
        <input type="text" name="aturan_pakai" maxlength="100"
               class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="md:col-span-1 text-right">
        <button type="button" onclick="this.closest('.produk-row').remove()"
                class="px-2.5 py-1.5 text-xs bg-red-50 text-red-700 rounded hover:bg-red-100 transition">
            🗑️
        </button>
    </div>
</div>
