{# 1 row pembayaran untuk split payment #}
<div class="grid grid-cols-1 md:grid-cols-12 gap-2 items-end pembayaran-row p-3 rounded-lg bg-slate-50 border border-slate-200">
    <div class="md:col-span-5">
        <label class="block text-xs text-slate-500 mb-1">Metode</label>
        <select name="metode_bayar" required
                class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="TUNAI">TUNAI</option>
            <option value="QRIS">QRIS</option>
            <option value="DEBIT">DEBIT</option>
            <option value="KREDIT">KREDIT</option>
            <option value="TRANSFER">TRANSFER</option>
        </select>
    </div>
    <div class="md:col-span-5">
        <label class="block text-xs text-slate-500 mb-1">Nominal</label>
        <input type="number" name="nominal" min="1" step="1" required
               class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="md:col-span-2 text-right">
        <button type="button" onclick="this.closest('.pembayaran-row').remove()"
                class="px-2.5 py-1.5 text-xs bg-red-50 text-red-700 rounded hover:bg-red-100 transition">
            🗑️
        </button>
    </div>
</div>
