{# Single penyakit kronis row #}
<div class="grid grid-cols-1 md:grid-cols-7 gap-2 items-end penyakit-row p-3 rounded-lg bg-slate-50 border border-slate-200">
    <div class="md:col-span-2">
        <label class="block text-xs text-slate-500 mb-1">Nama Penyakit</label>
        <input type="text" name="nama_penyakit" maxlength="100"
               placeholder="mis. Diabetes, Hipertensi"
               class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded
                      focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="md:col-span-4">
        <label class="block text-xs text-slate-500 mb-1">Catatan</label>
        <input type="text" name="penyakit_catatan" maxlength="255"
               placeholder="mis. konsumsi metformin 500mg 2x sehari"
               class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded
                      focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="md:col-span-1 text-right">
        <button type="button"
                onclick="this.closest('.penyakit-row').remove()"
                class="px-2.5 py-1.5 text-xs bg-red-50 text-red-700 rounded hover:bg-red-100 transition">
            🗑️ Hapus
        </button>
    </div>
</div>
