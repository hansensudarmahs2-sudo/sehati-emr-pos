{# Single alergi row — di-append ke #alergi-rows via HTMX #}
<div class="grid grid-cols-1 md:grid-cols-7 gap-2 items-end alergi-row p-3 rounded-lg bg-slate-50 border border-slate-200">
    <div class="md:col-span-2">
        <label class="block text-xs text-slate-500 mb-1">Alergen</label>
        <input type="text" name="alergen" maxlength="100"
               placeholder="mis. Penicillin, udang, debu"
               class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded
                      focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="md:col-span-3">
        <label class="block text-xs text-slate-500 mb-1">Gejala</label>
        <input type="text" name="alergi_gejala" maxlength="255"
               placeholder="mis. ruam, sesak napas"
               class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded
                      focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="md:col-span-1">
        <label class="block text-xs text-slate-500 mb-1">Tingkat</label>
        <select name="alergi_tingkat"
                class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded
                       focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="Ringan">Ringan</option>
            <option value="Sedang">Sedang</option>
            <option value="Berat">Berat</option>
        </select>
    </div>
    <div class="md:col-span-1 text-right">
        <button type="button"
                onclick="this.closest('.alergi-row').remove()"
                class="px-2.5 py-1.5 text-xs bg-red-50 text-red-700 rounded hover:bg-red-100 transition">
            🗑️ Hapus
        </button>
    </div>
</div>
