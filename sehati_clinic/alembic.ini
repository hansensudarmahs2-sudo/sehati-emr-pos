# =============================================================================
# Alembic Configuration
# =============================================================================
# Note: sqlalchemy.url di-override dinamis dari .env via migrations/env.py.
# Setting di sini hanya default; tidak akan dipakai saat runtime.

[alembic]
# Path to migration scripts
script_location = migrations

# Template untuk nama file revision: <YYYYMMDD_HHMM>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timezone untuk nama file (Jakarta)
timezone = Asia/Jakarta

# Max length untuk slug di nama file
truncate_slug_length = 40

# Path separator
sqlalchemy.url = driver://user:pass@localhost/dbname

# =============================================================================
# Logging
# =============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
