# ============================================================================
# nginx reverse proxy — Sehati Clinic (LAN, HTTP)
# Salin ke: /etc/nginx/sites-available/sehati
# Lalu: sudo ln -s /etc/nginx/sites-available/sehati /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# ----------------------------------------------------------------------------
# Staf akses http://<IP-SERVER>/  (tanpa :8000). Statis di-serve nginx (cepat).
# X-Forwarded-For WAJIB: dipakai rate-limit per-IP + (kelak) resolusi klinik-per-IP.
# ============================================================================
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10M;   # cukup untuk upload logo (max 500KB) + margin

    location /static/ {
        alias /opt/sehati_clinic/app/web/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
# CATATAN: saat pindah ke HTTPS/remote nanti → tambah listen 443 ssl + sertifikat,
# redirect 80→443, aktifkan HSTS, dan set COOKIE_SECURE=true di .env.
